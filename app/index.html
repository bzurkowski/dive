<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dive</title>
    <script>
      // Theme before first paint: the saved choice, else the OS setting.
      var saved
      try {
        saved = localStorage.getItem('dive-theme')
      } catch {}
      document.documentElement.dataset.theme =
        saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script id="dive-data" type="application/json">__DIVE_DATA__</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
